<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roses for Bea Antukin</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a0a10;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: Georgia, serif;
    overflow: hidden;
  }

  .scene {
    position: relative;
    width: 500px;
    height: 580px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .bouquet {
    position: relative;
    width: 380px;
    height: 560px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  /* Ribbon */
  .ribbon {
    position: absolute;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    width: 90px;
    height: 32px;
    background: linear-gradient(135deg, #e8a0b8, #c2185b, #e8a0b8);
    border-radius: 16px;
    z-index: 30;
    box-shadow: 0 2px 8px rgba(194,24,91,0.4);
  }
  .ribbon::before, .ribbon::after {
    content: '';
    position: absolute;
    width: 30px;
    height: 40px;
    background: linear-gradient(135deg, #f48fb1, #c2185b);
    border-radius: 50% 50% 50% 0;
    top: -10px;
  }
  .ribbon::before { left: -18px; transform: rotate(-30deg); }
  .ribbon::after  { right: -18px; transform: rotate(30deg) scaleX(-1); }

  /* Stems */
  .stems {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 70px;
    height: 130px;
    z-index: 5;
  }
  .stem {
    position: absolute;
    bottom: 0;
    width: 5px;
    border-radius: 3px;
    background: linear-gradient(to bottom, #388e3c, #1b5e20);
  }
  .stem:nth-child(1) { height: 110px; left: 10px; transform: rotate(-12deg); transform-origin: bottom center; }
  .stem:nth-child(2) { height: 120px; left: 18px; transform: rotate(-6deg);  transform-origin: bottom center; }
  .stem:nth-child(3) { height: 125px; left: 28px; transform: rotate(0deg);   transform-origin: bottom center; }
  .stem:nth-child(4) { height: 120px; left: 38px; transform: rotate(5deg);   transform-origin: bottom center; }
  .stem:nth-child(5) { height: 115px; left: 48px; transform: rotate(10deg);  transform-origin: bottom center; }
  .stem:nth-child(6) { height: 105px; left: 56px; transform: rotate(16deg);  transform-origin: bottom center; }

  /* Roses area */
  .roses {
    position: absolute;
    bottom: 95px;
    width: 100%;
    height: 400px;
  }

  .rose {
    position: absolute;
    width: 70px;
    height: 70px;
    animation: sway 4s ease-in-out infinite;
  }
  .rose:nth-child(odd)  { animation-direction: alternate; }
  .rose:nth-child(even) { animation-direction: alternate-reverse; }

  @keyframes sway {
    0%   { transform: rotate(-1.5deg) translateY(0px); }
    100% { transform: rotate(1.5deg)  translateY(-3px); }
  }

  .rose svg { width: 70px; height: 70px; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4)); }

  /* Sparkles */
  .sparkle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 2.5s ease-in-out infinite;
    opacity: 0;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50%       { opacity: 0.9; transform: scale(1.2); }
  }

  /* Title */
  .title-area {
    margin-top: 18px;
    text-align: center;
    color: #f8bbd0;
    letter-spacing: 0.15em;
    font-size: 15px;
    font-style: italic;
    animation: glow 3s ease-in-out infinite alternate;
  }
  @keyframes glow {
    from { text-shadow: 0 0 8px #f48fb1; }
    to   { text-shadow: 0 0 20px #ec407a, 0 0 30px #f48fb1; }
  }
</style>
</head>
<body>

<div class="scene">
  <div class="bouquet">

    <div class="stems">
      <div class="stem"></div>
      <div class="stem"></div>
      <div class="stem"></div>
      <div class="stem"></div>
      <div class="stem"></div>
      <div class="stem"></div>
    </div>

    <div class="ribbon"></div>

    <div class="roses" id="rosesContainer"></div>

    <div class="sparkle" style="top:30px;  left:160px; animation-delay:0s;"></div>
    <div class="sparkle" style="top:20px;  left:220px; animation-delay:0.5s;"></div>
    <div class="sparkle" style="top:60px;  left:130px; animation-delay:1s;"></div>
    <div class="sparkle" style="top:10px;  left:280px; animation-delay:1.5s;"></div>
    <div class="sparkle" style="top:80px;  left:300px; animation-delay:0.8s;"></div>
    <div class="sparkle" style="top:50px;  left:100px; animation-delay:1.2s;"></div>
  </div>
</div>

<div class="title-area">🌸 Roses for you Bea Antukin  🌸</div>

<script>
  const positions = [
    { bottom:'260px', left:'155px' },
    { bottom:'240px', left:'215px' },
    { bottom:'200px', left:'115px' },
    { bottom:'195px', left:'175px' },
    { bottom:'190px', left:'245px' },
    { bottom:'155px', left:'90px'  },
    { bottom:'148px', left:'155px' },
    { bottom:'142px', left:'220px' },
    { bottom:'100px', left:'115px' },
    { bottom:'95px',  left:'185px' },
  ];

  const roseColors = [
    ['#f48fb1','#e91e63','#ad1457','#f8bbd0'],
    ['#f06292','#e91e63','#880e4f','#fce4ec'],
    ['#ec407a','#c2185b','#ad1457','#fce4ec'],
    ['#f48fb1','#e91e63','#c2185b','#f8bbd0'],
    ['#f06292','#d81b60','#880e4f','#fce4ec'],
    ['#ec407a','#e91e63','#ad1457','#f8bbd0'],
    ['#f48fb1','#c2185b','#880e4f','#fce4ec'],
    ['#f06292','#e91e63','#ad1457','#fce4ec'],
    ['#ec407a','#d81b60','#c2185b','#f8bbd0'],
    ['#f48fb1','#e91e63','#880e4f','#fce4ec'],
  ];

  function makeSVGRose(colors, delay) {
    const [petal, center, dark, light] = colors;
    const id = 'rg' + delay.toString().replace('.','');
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="animation-delay:${delay}s">
      <defs>
        <radialGradient id="${id}" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="${light}"/>
          <stop offset="100%" stop-color="${dark}"/>
        </radialGradient>
      </defs>
      <ellipse cx="50" cy="22" rx="14" ry="20" fill="${petal}" opacity="0.9"  transform="rotate(0,50,50)"/>
      <ellipse cx="50" cy="22" rx="14" ry="20" fill="${petal}" opacity="0.85" transform="rotate(45,50,50)"/>
      <ellipse cx="50" cy="22" rx="14" ry="20" fill="${petal}" opacity="0.85" transform="rotate(90,50,50)"/>
      <ellipse cx="50" cy="22" rx="14" ry="20" fill="${petal}" opacity="0.85" transform="rotate(135,50,50)"/>
      <ellipse cx="50" cy="22" rx="14" ry="20" fill="${petal}" opacity="0.85" transform="rotate(180,50,50)"/>
      <ellipse cx="50" cy="22" rx="14" ry="20" fill="${petal}" opacity="0.85" transform="rotate(225,50,50)"/>
      <ellipse cx="50" cy="22" rx="14" ry="20" fill="${petal}" opacity="0.85" transform="rotate(270,50,50)"/>
      <ellipse cx="50" cy="22" rx="14" ry="20" fill="${petal}" opacity="0.85" transform="rotate(315,50,50)"/>
      <ellipse cx="50" cy="28" rx="11" ry="16" fill="${center}" opacity="0.95" transform="rotate(22,50,50)"/>
      <ellipse cx="50" cy="28" rx="11" ry="16" fill="${center}" opacity="0.95" transform="rotate(67,50,50)"/>
      <ellipse cx="50" cy="28" rx="11" ry="16" fill="${center}" opacity="0.95" transform="rotate(112,50,50)"/>
      <ellipse cx="50" cy="28" rx="11" ry="16" fill="${center}" opacity="0.95" transform="rotate(157,50,50)"/>
      <ellipse cx="50" cy="28" rx="11" ry="16" fill="${center}" opacity="0.95" transform="rotate(202,50,50)"/>
      <ellipse cx="50" cy="28" rx="11" ry="16" fill="${center}" opacity="0.95" transform="rotate(247,50,50)"/>
      <ellipse cx="50" cy="35" rx="8"  ry="11" fill="${dark}"   opacity="1"    transform="rotate(0,50,50)"/>
      <ellipse cx="50" cy="35" rx="8"  ry="11" fill="${dark}"   opacity="1"    transform="rotate(60,50,50)"/>
      <ellipse cx="50" cy="35" rx="8"  ry="11" fill="${dark}"   opacity="1"    transform="rotate(120,50,50)"/>
      <ellipse cx="50" cy="35" rx="8"  ry="11" fill="${dark}"   opacity="1"    transform="rotate(180,50,50)"/>
      <circle cx="50" cy="50" r="9" fill="${light}" opacity="1"/>
      <circle cx="50" cy="50" r="5" fill="${petal}" opacity="0.8"/>
      <ellipse cx="26" cy="72" rx="10" ry="5" fill="#43a047" opacity="0.9" transform="rotate(-30,26,72)"/>
    </svg>`;
  }

  const container = document.getElementById('rosesContainer');
  positions.forEach((pos, i) => {
    const div = document.createElement('div');
    div.className = 'rose';
    div.style.bottom = pos.bottom;
    div.style.left   = pos.left;
    div.style.animationDelay = (i * 0.3) + 's';
    div.innerHTML = makeSVGRose(roseColors[i], i * 0.3);
    container.appendChild(div);
  });
</script>
</body>
</html>
